name: payment-ledger

# Both Postgres shards share this config. max_prepared_transactions enables
# the Rung 4 2PC (PREPARE TRANSACTION).
x-postgres: &pg
  image: postgres:18
  command: ["postgres", "-c", "max_prepared_transactions=200"]
  environment:
    POSTGRES_USER: ledger
    POSTGRES_DB: ledger
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger-dev}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
    interval: 2s
    timeout: 3s
    retries: 30

# Shared settings for every service built from deploy/Dockerfile.
x-app: &app
  image: payment-ledger:dev
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment: &app-env
    DATABASE_URL: postgres://ledger:${POSTGRES_PASSWORD:-ledger-dev}@postgres:5432/ledger?sslmode=disable
    # Rung 4: comma-separated shard URLs, shard 0 first. One URL = unsharded.
    SHARD_URLS: ${SHARD_URLS:-postgres://ledger:${POSTGRES_PASSWORD:-ledger-dev}@postgres:5432/ledger?sslmode=disable}
    CROSS_SHARD: ${CROSS_SHARD:-2pc}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres: # shard 0, always on
    <<: *pg
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  postgres-shard1: # shard 1, Rung 4 only
    <<: *pg
    profiles: ["shards"]
    ports:
      - "55433:5432"
    volumes:
      - pgdata1:/var/lib/postgresql

  toxiproxy: # network faults between app and shards (Rung 4)
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["faults"]
    ports:
      - "8474:8474"

  migrate:
    <<: *app
    command: ["api", "migrate"]
    profiles: ["tools"]

  seed:
    <<: *app
    entrypoint: ["seed"]
    profiles: ["tools"]

  checker:
    <<: *app
    entrypoint: ["checker"]
    command: ["--once"]
    profiles: ["tools"]

  # restart: on-failure brings api/worker back after a failpoint exit (Rung 2).
  api:
    <<: *app
    command: ["api", "serve"]
    restart: on-failure
    environment:
      <<: *app-env
      LEDGER_SERVICE_TOKENS: ${LEDGER_SERVICE_TOKENS:-dev-token}
      HOLD_TTL: ${HOLD_TTL:-30s}
      CAS_ATTEMPTS: ${CAS_ATTEMPTS:-10}
      FAILPOINTS: ${FAILPOINTS:-}
    ports:
      - "18080:8080"

  worker:
    <<: *app
    command: ["worker"]
    restart: on-failure
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      CAS_ATTEMPTS: ${CAS_ATTEMPTS:-10}
      FAILPOINTS: ${FAILPOINTS:-}

  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    environment:
      TARGET: api:8080
      LEDGER_TOKEN: ${LEDGER_SERVICE_TOKENS:-dev-token}
    volumes:
      - ../harness/k6:/scripts:ro
      - ../proto:/proto:ro
      - ../harness/out:/out

volumes:
  pgdata: {}
  pgdata1: {}
